[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biotradeai"
version = "0.1.0"
description = "Multi-agent decision support for biotech catalyst trading (paper-first, human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# LLM providers are optional so you only install what you use.
anthropic = ["anthropic>=0.40"]
graph = ["langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0"]
rag = ["chromadb>=1.0", "sentence-transformers>=3.0", "pypdf>=4.0"]
brokers = ["alpaca-py>=0.30", "mcp>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
biotradeai = "biotradeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*", "ignore::DeprecationWarning:chromadb.*"]
markers = [
    "integration: needs network or a running local service (Ollama, broker sandbox). Skipped by default; run with -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["biotradeai"]
plugins = ["pydantic.mypy"]
