# Single source of truth for every risk threshold. Code must never hard-code these.
mode: paper                  # paper | shadow | live
min_ev: 0.20
min_runway_months: 6         # Risk Agent veto
fatal_runway_months: 3       # ToT immediate prune
max_position_pct: 0.05       # of account equity
max_concurrent_positions: 3
min_confidence: 0.70
max_spread_pct: 0.015
ttl_hours: 24
daily_drawdown_limit: 0.03   # vs start-of-day account equity
max_api_errors: 3            # consecutive
runway:
  burn_lookback_quarters: 4    # burn = max(latest quarter, mean of last N quarters)
rag:
  chunk_tokens: 400            # target chunk size (plan: 300-500)
  chunk_overlap_tokens: 50
  top_k: 5                     # plan: 3-5
  hybrid: true                 # fuse BM25 keyword ranking with vector ranking (RRF)
  max_pool: 2000               # exact search over the filtered pool up to this size
  min_similarity: 0.20         # cosine; below this a chunk is not evidence
  min_supporting_chunks: 2     # fewer relevant chunks -> lower confidence
  recall_target: 0.90          # agreed acceptance target (recall@top_k)
  tier_weights: {1: 1.0, 2: 0.85, 3: 0.6}   # source authority
orders:
  allowed_types: [limit]
  allow_extended_hours: false   # revisit after Robinhood spike (Phase 3)
  approval_ttl_minutes: 15      # how long a human approval token stays valid
tot:
  depth: 3
  beam_width: 2
  residual_scenario_return: -0.70   # PLACEHOLDER, set deliberately before Phase 5
  max_prob_adjustment: 0.15
  prob_sum_tolerance: 0.001
  ev_match_tolerance: 0.0001        # Research vs Risk EV; a bigger gap blocks the trade
sell:
  profit_target_pct: 0.30
  scale_out_fraction: 0.50
  trailing_stop_pct: 0.10          # PLACEHOLDER, set deliberately before Phase 6
  completion_delay_months: 6
live_gate:
  min_paper_days: 90
  pilot_position_pct: 0.01
  pilot_max_positions: 1
